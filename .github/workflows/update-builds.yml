name: Update character builds

on:
  schedule:
    - cron: "0 0 */5 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-builds:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch guides and render cards
        run: |
          python - <<'PY'
          import asyncio

          from ef_teams.client import GuideClient

          async def update_builds() -> None:
              client = GuideClient()
              await client.update_guides()
              await client.render_all()

          asyncio.run(update_builds())
          PY

      - name: Commit updated builds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ef_teams/assets/metadata output
          if git diff --cached --quiet; then
            echo "No build changes to commit."
          else
            git commit -m "chore: update character builds"
            git push
          fi